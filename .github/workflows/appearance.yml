name: Keyboard return on simulator
on: workflow_dispatch
permissions:
  contents: read
jobs:
  return-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 tools/dictionary.py
          python3 tools/artwork.py
          command -v xcodegen || brew install xcodegen
          xcodegen generate
          bash tools/test-return.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Keyboard-return-results
          path: |
            ReturnDiagnostics
            ReturnResult.xcresult

