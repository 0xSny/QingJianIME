name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test dictionary
        run: |
          python3 tools/dictionary.py
          c++ -std=c++17 -O2 tests/engine.cpp -o /tmp/test-engine
          /tmp/test-engine
      - name: Generate icon and Xcode project
        run: |
          python3 tools/artwork.py
          command -v xcodegen || brew install xcodegen
          xcodegen generate
          echo "VERSION=1.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "BUILD=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))" >> "$GITHUB_ENV"
      - name: Compile unsigned device Release
        run: |
          xcodebuild -project QingJian.xcodeproj -scheme QingJian -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO ARCHS=arm64 MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" build
      - name: Verify and assemble Payload
        run: |
          mkdir -p build/Payload
          ditto DerivedData/Build/Products/Release-iphoneos/QingJian.app build/Payload/QingJian.app
          python3 tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: QingJian-unsigned
          path: QingJian.ipa
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git log -1 --format=%B > /tmp/notes
          gh release create "v$VERSION" QingJian.ipa --target "$GITHUB_SHA" --title "清简 $VERSION" --notes-file /tmp/notes
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
