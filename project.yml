name: QingJian
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    SWIFT_VERSION: "5.0"
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  QingJian:
    type: application
    platform: iOS
    sources: [Host, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.custom.ime
        INFOPLIST_FILE: Host/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: Shared/Notify.h
        CODE_SIGN_ENTITLEMENTS: Shared/Group.entitlements
    dependencies:
      - target: Keyboard
        embed: true
  Keyboard:
    type: app-extension
    platform: iOS
    sources: [Keyboard, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.custom.ime.keyboard
        INFOPLIST_FILE: Keyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: Shared/Group.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: Keyboard/Bridge.h
        APPLICATION_EXTENSION_API_ONLY: YES
  KeycapTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: tests/Keycaps
      - path: Keyboard
        excludes: [Resources, Info.plist]
      - path: Shared
        excludes: [Group.entitlements]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.custom.ime.keycaptests
        SWIFT_OBJC_BRIDGING_HEADER: Keyboard/Bridge.h
  ReturnUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [tests/ReturnUI]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.custom.ime.tests
        TEST_TARGET_NAME: QingJian
    dependencies:
      - target: QingJian
schemes:
  ReturnUI:
    build:
      targets:
        QingJian: all
        ReturnUITests: [test]
        KeycapTests: [test]
    test:
      targets: [KeycapTests, ReturnUITests]
  QingJian:
    build:
      targets:
        QingJian: all
