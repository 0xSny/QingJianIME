name: QingJian
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    SWIFT_VERSION: "5.0"
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  QingJian:
    type: application
    platform: iOS
    sources: [Host, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.custom.ime
        INFOPLIST_FILE: Host/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Shared/Group.entitlements
    dependencies:
      - target: Keyboard
        embed: true
  Keyboard:
    type: app-extension
    platform: iOS
    sources: [Keyboard, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.custom.ime.keyboard
        INFOPLIST_FILE: Keyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: Shared/Group.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: Keyboard/Bridge.h
        APPLICATION_EXTENSION_API_ONLY: YES
schemes:
  QingJian:
    build:
      targets:
        QingJian: all
